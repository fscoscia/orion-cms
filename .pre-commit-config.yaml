repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      # Generated files keep the build output as is: rebuilding would undo the fix.
      - id: end-of-file-fixer
        exclude: ^src/orion/core/static/orion/(css/orion\.css|vendor/)
      - id: trailing-whitespace
        exclude: ^src/orion/core/static/orion/(css/orion\.css|vendor/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
