{# The page title as its h1, unless the body opens with a hero, which holds it, or with a full-width carousel, which takes its place on screen. #}
{% if page.starts_with_full_carousel %}
  <h1 class="sr-only">{{ page.title }}</h1>
{% elif not page.starts_with_hero %}
  <header class="mx-auto max-w-6xl px-4 pt-12 md:pt-16">
    <h1 class="orion-title text-4xl font-bold tracking-tight md:text-5xl">{{ page.title }}</h1>
  </header>
{% endif %}
