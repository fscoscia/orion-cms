{% extends "orion/base.html" %}
{% load i18n wagtailcore_tags %}

{% block content %}
  <section class="mx-auto max-w-3xl space-y-6 px-4 py-12 md:py-16" role="status">
    <h1 class="orion-title text-4xl font-bold tracking-tight md:text-5xl">{{ page.title }}</h1>
    {% if page.thank_you_text %}
      <div class="orion-richtext prose max-w-none">{{ page.thank_you_text|richtext }}</div>
    {% else %}
      <p class="text-lg">{% translate "Thank you. We received your message." %}</p>
    {% endif %}
  </section>
{% endblock %}
