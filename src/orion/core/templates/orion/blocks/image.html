{% load wagtailimages_tags %}
<figure class="orion-block block-image--{{ value.style }} mx-auto max-w-6xl px-4 py-10">
  {% if value.image.is_sample %}{% include "orion/blocks/includes/sample_image.html" with image=value.image alt=value.image.contextual_alt_text class_name="h-auto w-full rounded-lg" %}{% else %}{% srcset_image value.image format-webp width-{480,800,1200,1600} sizes="(min-width: 72rem) 70rem, 100vw" alt=value.image.contextual_alt_text loading="lazy" decoding="async" class="h-auto w-full rounded-lg" %}{% endif %}
  {% if value.caption %}<figcaption class="mt-3 text-sm text-ink-muted">{{ value.caption }}</figcaption>{% endif %}
</figure>
