{% load orion_core %}
<section class="orion-block block-accordion--{{ value.style }} mx-auto max-w-3xl space-y-8 px-4 py-12">
  {% include "orion/blocks/includes/title.html" with title=value.title %}
  <div class="divide-y divide-line border-y border-line">
    {% for item in value.items %}
      <details class="group">
        <summary class="flex cursor-pointer list-none items-center justify-between gap-4 py-4 [&::-webkit-details-marker]:hidden">
          <h3 class="text-lg font-semibold">{{ item.title }}</h3>
          <span class="shrink-0 transition-transform group-open:rotate-180">{% include "orion/includes/icon.html" with name="chevron-down" %}</span>
        </summary>
        <div class="orion-richtext prose max-w-none pb-4">{{ item.body }}</div>
      </details>
    {% endfor %}
  </div>
</section>
